spring.application.name=devboard-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/devboard
spring.datasource.username=devboard_app
spring.datasource.password=${DEVBOARD_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

devboard.jwt.secret=${DEVBOARD_JWT_SECRET}
devboard.jwt.expiration-ms=${DEVBOARD_JWT_EXPIRATION_MS:3600000}
